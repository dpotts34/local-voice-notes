[project]
name = "voice-note-intake"
version = "0.1.0"
description = "Portable durable voice-note intake service"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.11,<4", "PyYAML>=6,<7", "markdown-it-py>=3,<5"]

[project.scripts]
voice-note-intake = "voice_note_intake.main:main"
voice-vault-lint = "voice_note_intake.lint_vault:main"
voice-note-vault-sync = "voice_note_intake.vault_sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_note_intake"]
